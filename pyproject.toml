[project]
name = "miraichem"
version = "0.1.0"
description = "Automated benchmarking and recommendation of VQE configurations for small molecules on noisy IBM quantum backends."
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are pinned after the Phase 0 compatibility investigation (see docs/DECISIONS.md).
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]

[project.scripts]
miraichem = "miraichem.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The notebook execution test takes about 2 minutes, so it only runs with `pytest -m notebook`.
addopts = "-m 'not notebook'"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "notebook: executes the demo notebook end to end (run with -m notebook)",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
