# N2 in the 6-31G Gaussian basis with the two 1s core orbitals frozen: 10 electrons in 16 orbitals,
# 32 qubits. Exact FCI is possible but takes about 6 minutes (19 million determinants), so by default
# results are compared with Hartree-Fock and CCSD. Equilibrium bond length ~1.098 A.
name: N2_631G
geometry: "N 0 0 0; N 0 0 {bond_length}"
basis: 6-31g
charge: 0
spin: 0
active_electrons: 10
active_orbitals: 16
