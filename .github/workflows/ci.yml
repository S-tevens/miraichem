name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests (no hardware, no network)
        run: pytest -q

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  demo:
    name: Offline demo build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
          npm --prefix frontend ci
      - name: Build the static demo and export its data
        run: |
          npm --prefix frontend run build:demo
          miraichem export-demo
      - name: Keep the demo as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: miraichem-offline-demo
          path: frontend/dist-demo
          retention-days: 30
